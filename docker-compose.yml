# Entirely optional (and not scored) — but `docker compose up` gives you the
# whole thing on one command with no local Node required.
#
#   cp .env.example .env   # add your keys
#   docker compose up --build
#   open http://localhost:8787
services:
  polyglot:
    build: .
    ports:
      - '8787:8787'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_PATH: /data/polyglot.sqlite
      # The API also serves the built UI in this image, so one origin.
      CORS_ORIGINS: http://localhost:8787
    volumes:
      - polyglot-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  polyglot-data:
